# Prometheus configuration for docker compose.
# The backend is reachable as "backend:6000" inside the compose network.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: interviewx-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:6000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
